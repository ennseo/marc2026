# Run against an existing MARC platform on the same LAN and ROS domain.
# Copy .env.example to .env and supply your own issued credentials.
services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: marc-agent:local
    network_mode: host
    environment:
      MARC_TEAM_ID: "${MARC_TEAM_ID:?Set MARC_TEAM_ID in .env or your environment}"
      MARC_TOKEN: "${MARC_TOKEN:?Set MARC_TOKEN in .env or your environment}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
